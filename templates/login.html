<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Twin — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:20px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,0.1);border:1px solid #e2e8f0}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.logo-mark{width:38px;height:38px;background:#0ea5e9;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 12px rgba(14,165,233,0.35)}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:#0f172a}
.tabs{display:flex;background:#f1f5f9;border-radius:10px;padding:3px;gap:3px;margin-bottom:28px}
.tab{flex:1;padding:8px;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:600;background:transparent;color:#64748b;transition:all .2s}
.tab.active{background:#fff;color:#0f172a;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
input{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;color:#0f172a;background:#fff}
input:focus{border-color:#0ea5e9}
.btn{width:100%;padding:12px;background:#0ea5e9;color:#fff;border:none;border-radius:10px;font-size:15px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;transition:all .2s;margin-top:4px;box-shadow:0 2px 8px rgba(14,165,233,0.3)}
.btn:hover{background:#0284c7;transform:translateY(-1px)}
.forgot{text-align:right;margin-bottom:14px}
.forgot a{font-size:13px;color:#0ea5e9;text-decoration:none;font-weight:500}
.forgot a:hover{text-decoration:underline}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.msg.error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;display:block}
.msg.success{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;display:block}
#form-signup{display:none}

@media (max-width: 480px) {
  body { padding: 16px; align-items: flex-start; padding-top: 40px; }
  .card { padding: 28px 22px; border-radius: 16px; }
  h2 { font-size: 20px; }
  p { font-size: 13px; }
  input { font-size: 14px; padding: 10px 12px; }
  .btn { padding: 11px; font-size: 14px; }
  .logo-text { font-size: 15px; }
  .logo-mark { width: 32px; height: 32px; font-size: 16px; }
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">🤖</div>
    <div class="logo-text">MY TWIN</div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('login')">Sign In</button>
    <button class="tab" id="tab-signup" onclick="showTab('signup')" {% if not allow_signup %}style="display:none"{% endif %}>Sign Up</button>
  </div>
  {% if error %}<div class="msg error">{{ error }}</div>{% endif %}
  {% if success %}<div class="msg success">{{ success }}</div>{% endif %}

  <form id="form-login" method="POST" action="/login">
    <input type="hidden" name="form" value="login">
    <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="you@example.com" required></div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>
    <div class="forgot"><a href="/forgot-password">Forgot password?</a></div>
    <button class="btn" type="submit">Sign In →</button>
  </form>

  <form id="form-signup" method="POST" action="/login">
    <input type="hidden" name="form" value="signup">
    <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="you@example.com" required></div>
    <div class="form-group"><label>Password</label><input type="password" name="password" placeholder="Min 8 characters" minlength="8" required></div>
    <div class="form-group"><label>Confirm Password</label><input type="password" name="confirm" placeholder="Repeat password" required></div>
    <button class="btn" type="submit">Create Account →</button>
  </form>
</div>
<script>
function showTab(t){
  document.getElementById('form-login').style.display=t==='login'?'block':'none';
  document.getElementById('form-signup').style.display=t==='signup'?'block':'none';
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',(t==='login'&&i===0)||(t==='signup'&&i===1)));
}
</script>
</body></html>
