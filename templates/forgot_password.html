<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Twin — Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:20px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,0.1);border:1px solid #e2e8f0}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.logo-mark{width:38px;height:38px;background:#0ea5e9;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 12px rgba(14,165,233,.35)}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:#0f172a}
h2{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#0f172a;margin-bottom:6px}
p{font-size:14px;color:#64748b;margin-bottom:24px;line-height:1.6}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:5px}
input{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;color:#0f172a}
input:focus{border-color:#0ea5e9}
.btn{width:100%;padding:12px;background:#0ea5e9;color:#fff;border:none;border-radius:10px;font-size:15px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;margin-top:14px;box-shadow:0 2px 8px rgba(14,165,233,.3)}
.btn:hover{background:#0284c7}
.back{display:block;text-align:center;margin-top:16px;font-size:13px;color:#0ea5e9;text-decoration:none;font-weight:500}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}
.msg.error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.msg.success{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="logo-mark">🤖</div><div class="logo-text">MY TWIN</div></div>
  <h2>Forgot Password?</h2>
  <p>Enter your email and we'll send a recovery link to your Gmail.</p>
  {% if error %}<div class="msg error">{{ error }}</div>{% endif %}
  {% if success %}<div class="msg success">{{ success }}</div>{% endif %}
  <form method="POST" action="/forgot-password">
    <label>Email address</label>
    <input type="email" name="email" placeholder="davronbekmalikov96@gmail.com" required>
    <button class="btn" type="submit">Send Recovery Link →</button>
  </form>
  <a class="back" href="/login">← Back to Sign In</a>
</div>
</body></html>
